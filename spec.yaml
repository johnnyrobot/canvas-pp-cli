  liveassessments:
    description: Manage live assessment results
    endpoints:
      post_results:
        method: POST
        path: /api/v1/courses/{course_id}/live_assessments/{assessment_id}/results
        description: Creates live assessment results and adds them to a live assessment
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: assessment_id
          type: string
          required: true
          positional: true
          description: assessment id (path)
      get_results:
        method: GET
        path: /api/v1/courses/{course_id}/live_assessments/{assessment_id}/results
        description: Returns a paginated list of live assessment results
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: assessment_id
          type: string
          required: true
          positional: true
          description: assessment id (path)
        - name: user_id
          type: int
          required: false
          description: If set, restrict results to those for this user
      post_live_assessments:
        method: POST
        path: /api/v1/courses/{course_id}/live_assessments
        description: Creates or finds an existing live assessment with the given key and aligns it with the linked outcome
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
      get_live_assessments:
        method: GET
        path: /api/v1/courses/{course_id}/live_assessments
        description: Returns a paginated list of live assessments.
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
  logins:
    description: API for creating and viewing user logins under an account
    endpoints:
      index:
        method: GET
        path: /api/v1/accounts/{account_id}/logins
        description: List user logins
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      index_2:
        method: GET
        path: /api/v1/users/{user_id}/logins
        description: List user logins
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
      forgot_password:
        method: POST
        path: /api/v1/users/reset_password
        description: Kickoff password recovery flow
      create:
        method: POST
        path: /api/v1/accounts/{account_id}/logins
        description: Create a user login
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        body:
        - name: user[id]
          type: string
          required: true
          description: The ID of the user to create the login for.
        - name: login[unique_id]
          type: string
          required: true
          description: The unique ID for the new login.
        - name: login[password]
          type: string
          required: false
          description: The new login's password.
        - name: login[sis_user_id]
          type: string
          required: false
          description: SIS ID for the login. To set this parameter, the caller must be able to manage SIS permissions on the account.
        - name: login[integration_id]
          type: string
          required: false
          description: Integration ID for the login. To set this parameter, the caller must be able to manage SIS permissions on the account. The Integration ID is a secondary identifier useful for more complex SIS integrations.
        - name: login[authentication_provider_id]
          type: string
          required: false
          description: The authentication provider this login is associated with. Logins associated with a specific provider can only be used with that provider. Legacy providers (LDAP, CAS, SAML) will search for logins associated with them, or unassociated login
        - name: login[declared_user_type]
          type: string
          required: false
          description: The declared intention of the user type. This can be set, but does not change any Canvas functionality with respect to their access. A user can still be a teacher, admin, student, etc. in any particular context without regard to this settin
        - name: login[must_reset_password]
          type: bool
          required: false
          description: If true, the user will be required to change their password the next time they sign in with this login. Only valid for logins that support Canvas passwords.
        - name: user[existing_user_id]
          type: string
          required: false
          description: A Canvas User ID to identify a user in a trusted account (alternative to id, existing_sis_user_id, or existing_integration_id). This parameter is not available in OSS Canvas.
        - name: user[existing_integration_id]
          type: string
          required: false
          description: An Integration ID to identify a user in a trusted account (alternative to id, existing_user_id, or existing_sis_user_id). This parameter is not available in OSS Canvas.
        - name: user[existing_sis_user_id]
          type: string
          required: false
          description: An SIS User ID to identify a user in a trusted account (alternative to id, existing_integration_id, or existing_user_id). This parameter is not available in OSS Canvas.
        - name: user[trusted_account]
          type: string
          required: false
          description: The domain of the account to search for the user. This field is required when identifying a user in a trusted account. This parameter is not available in OSS Canvas.
      update:
        method: PUT
        path: /api/v1/accounts/{account_id}/logins/{id}
        description: Edit a user login
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        body:
        - name: login[unique_id]
          type: string
          required: false
          description: The new unique ID for the login.
        - name: login[password]
          type: string
          required: false
          description: The new password for the login. Admins can only set a password for another user if the "Password setting by admins" account setting is enabled.
        - name: login[old_password]
          type: string
          required: false
          description: The prior password for the login. Required if the caller is changing their own password.
        - name: login[sis_user_id]
          type: string
          required: false
          description: SIS ID for the login. To set this parameter, the caller must be able to manage SIS permissions on the account.
        - name: login[integration_id]
          type: string
          required: false
          description: Integration ID for the login. To set this parameter, the caller must be able to manage SIS permissions on the account. The Integration ID is a secondary identifier useful for more complex SIS integrations.
        - name: login[authentication_provider_id]
          type: string
          required: false
          description: The authentication provider this login is associated with. Logins associated with a specific provider can only be used with that provider. Legacy providers (LDAP, CAS, SAML) will search for logins associated with them, or unassociated login
        - name: login[workflow_state]
          type: string
          required: false
          description: 'Used to suspend or re-activate a login. Allowed values: active, suspended'
        - name: login[declared_user_type]
          type: string
          required: false
          description: The declared intention of the user type. This can be set, but does not change any Canvas functionality with respect to their access. A user can still be a teacher, admin, student, etc. in any particular context without regard to this settin
        - name: login[must_reset_password]
          type: bool
          required: false
          description: If true, the user will be required to change their password the next time they sign in with this login. Cleared automatically when the password is changed. Only valid for logins that support Canvas passwords.
        - name: override_sis_stickiness
          type: bool
          required: false
          description: Default is true. If false, any fields containing “sticky” changes will not be updated. See SIS CSV Format documentation for information on which fields can have SIS stickiness
      destroy:
        method: DELETE
        path: /api/v1/users/{user_id}/logins/{id}
        description: Delete a user login
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
