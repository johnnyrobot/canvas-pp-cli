name: canvas
description: Canvas LMS REST API CLI — the full A–Z surface with offline sync, search, and a local store
version: 0.1.0
base_url: https://canvas.instructure.com
health_check_path: /api/v1/users/self
category: productivity
auth:
  type: bearer_token
  header: Authorization
  format: Bearer {token}
  env_vars:
  - CANVAS_API_TOKEN
  - CANVAS_ACCESS_TOKEN
config:
  format: toml
  path: ~/.config/canvas-pp-cli/config.toml
resources:
  access_tokens:
    description: '{'
    endpoints:
      user_generated_tokens:
        method: GET
        path: /api/v1/users/{user_id}/user_generated_tokens
        description: List access tokens for a user
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        - name: per_page
          type: int
          required: false
          description: The number of results to return per page. Defaults to 10. Maximum of 100.
      show:
        method: GET
        path: /api/v1/users/{user_id}/tokens/{id}
        description: Show an access token
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      create:
        method: POST
        path: /api/v1/users/{user_id}/tokens
        description: Create an access token
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        body:
        - name: token[purpose]
          type: string
          required: true
          description: The purpose of the token.
        - name: token[expires_at]
          type: string
          required: false
          description: The time at which the token will expire.
        - name: token[scopes][]
          type: string
          required: false
          description: The scopes to associate with the token. Ignored if the default developer key does not have the "enable scopes" option enabled. In such cases, the token will inherit the user's permissions instead.
      update:
        method: PUT
        path: /api/v1/users/{user_id}/tokens/{id}
        description: Update an access token
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        body:
        - name: token[purpose]
          type: string
          required: false
          description: The purpose of the token.
        - name: token[expires_at]
          type: string
          required: false
          description: The time at which the token will expire.
        - name: token[scopes][]
          type: string
          required: false
          description: The scopes to associate with the token.
        - name: token[regenerate]
          type: bool
          required: false
          description: Regenerate the actual token.
      destroy:
        method: DELETE
        path: /api/v1/users/{user_id}/tokens/{id}
        description: Delete an access token
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
  accessibility_course_scans:
    description: '[AccessibilityCourseScansController#create](https://github.com/instructure/canvas-lms/blob/master/app/controllers/accessibility_course_scans_controller.rb)'
    endpoints:
      create:
        method: POST
        path: /api/v1/users/{user_id}/educator_accessibility_course_scan
        description: Trigger accessibility course scan
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
  accessibility_course_statistics:
    description: // Per-course accessibility issue counts for a user's active teacher/designer
    endpoints:
      index:
        method: GET
        path: /api/v1/users/{user_id}/educator_accessibility_course_statistics
        description: List accessibility course statistics
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          description: user id (path)
  account_calendars:
    description: API for viewing and toggling settings of account calendars.
    endpoints:
      index:
        method: GET
        path: /api/v1/account_calendars
        description: List available account calendars
        params:
        - name: search_term
          type: string
          required: false
          description: When included, searches available account calendars for the term. Returns matching results. Term must be at least 2 characters.
      show:
        method: GET
        path: /api/v1/account_calendars/{account_id}
        description: Get a single account calendar
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      update:
        method: PUT
        path: /api/v1/account_calendars/{account_id}
        description: Update a calendar
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        body:
        - name: visible
          type: bool
          required: false
          description: Allow administrators with manage_account_calendar_events permission to create events on this calendar, and allow users to view this calendar and its events.
        - name: auto_subscribe
          type: bool
          required: false
          description: When true, users will automatically see events from this account in their calendar, even if they haven't manually added that calendar.
      bulk_update:
        method: PUT
        path: /api/v1/accounts/{account_id}/account_calendars
        description: Update several calendars
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      all_calendars:
        method: GET
        path: /api/v1/accounts/{account_id}/account_calendars
        description: List all account calendars
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: search_term
          type: string
          required: false
          description: When included, searches all descendent accounts of provided account for the term. Returns matching results. Term must be at least 2 characters. Can be combined with a filter value.
        - name: filter
          type: string
          required: false
          description: 'When included, only returns calendars that are either visible or hidden. Can be combined with a search term. Allowed values: visible, hidden'
      visible_calendars_count:
        method: GET
        path: /api/v1/accounts/{account_id}/visible_calendars_count
        description: Count of all visible account calendars
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
  account_domain_lookups:
    endpoints:
      search:
        method: GET
        path: /api/v1/accounts/search
        description: Search account domains
        params:
        - name: name
          type: string
          required: false
          description: campus name
        - name: domain
          type: string
          required: false
          description: no description
        - name: latitude
          type: float
          required: false
          description: no description
        - name: longitude
          type: float
          required: false
          description: no description
  account_notifications:
    description: API for account notifications.
    endpoints:
      user_index:
        method: GET
        path: /api/v1/accounts/{account_id}/account_notifications
        description: Index of active global notification for the user
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: include_past
          type: bool
          required: false
          description: Include past and dismissed global announcements.
        - name: include_all
          type: bool
          required: false
          description: Include all global announcements, regardless of user's role or availability date. Only available to account admins.
        - name: show_is_closed
          type: bool
          required: false
          description: Include a flag for each notification indicating whether it has been read by the user.
      show:
        method: GET
        path: /api/v1/accounts/{account_id}/account_notifications/{id}
        description: Show a global notification
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      create:
        method: POST
        path: /api/v1/accounts/{account_id}/account_notifications
        description: Create a global notification
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        body:
        - name: account_notification[subject]
          type: string
          required: true
          description: The subject of the notification.
        - name: account_notification[message]
          type: string
          required: true
          description: The message body of the notification.
        - name: account_notification[start_at]
          type: string
          required: true
          description: The start date and time of the notification in ISO8601 format. e.g. 2014-01-01T01:00Z
        - name: account_notification[end_at]
          type: string
          required: true
          description: The end date and time of the notification in ISO8601 format. e.g. 2014-01-01T01:00Z
        - name: account_notification[icon]
          type: string
          required: false
          description: 'The icon to display with the notification. Note: Defaults to warning. Allowed values: warning, information, question, error, calendar'
        - name: account_notification_roles[]
          type: string
          required: false
          description: 'The role(s) to send global notification to. Note: ommitting this field will send to everyone Example: account_notification_roles: ["StudentEnrollment", "TeacherEnrollment"]'
      update:
        method: PUT
        path: /api/v1/accounts/{account_id}/account_notifications/{id}
        description: Update a global notification
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        body:
        - name: account_notification[subject]
          type: string
          required: false
          description: The subject of the notification.
        - name: account_notification[message]
          type: string
          required: false
          description: The message body of the notification.
        - name: account_notification[start_at]
          type: string
          required: false
          description: The start date and time of the notification in ISO8601 format. e.g. 2014-01-01T01:00Z
        - name: account_notification[end_at]
          type: string
          required: false
          description: The end date and time of the notification in ISO8601 format. e.g. 2014-01-01T01:00Z
        - name: account_notification[icon]
          type: string
          required: false
          description: 'The icon to display with the notification. Allowed values: warning, information, question, error, calendar'
        - name: account_notification_roles[]
          type: string
          required: false
          description: 'The role(s) to send global notification to. Note: ommitting this field will send to everyone Example: account_notification_roles: ["StudentEnrollment", "TeacherEnrollment"]'
      user_close_notification:
        method: DELETE
        path: /api/v1/accounts/{account_id}/account_notifications/{id}
        description: Close notification for user. Destroy notification for admin
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        - name: remove
          type: bool
          required: false
          description: Destroy the account notification.
  account_reports:
    description: API for accessing account reports.
    endpoints:
      available_reports:
        method: GET
        path: /api/v1/accounts/{account_id}/reports
        description: List Available Reports
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: include[]
          type: string
          required: false
          description: 'Array of additional information to include. "description_html":: an HTML description of the report, with example output "parameters_html":: an HTML form for the report parameters Allowed values: description_html, params_html'
      create:
        method: POST
        path: /api/v1/accounts/{account_id}/reports/{report}
        description: Start a Report
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: report
          type: string
          required: true
          positional: true
          description: report (path)
        body:
        - name: parameters[]
          type: string
          required: false
          description: The parameters will vary for each report. To fetch a list of available parameters for each report, see List Available Reports. A few example parameters have been provided below. Note that the example parameters provided below may not be val
        - name: parameters[skip_message]
          type: bool
          required: false
          description: If true, no message will be sent to the user upon completion of the report.
        - name: parameters[course_id]
          type: int
          required: false
          description: 'The id of the course to report on. Note: this parameter has been listed to serve as an example and may not be valid for every report.'
        - name: parameters[users]
          type: bool
          required: false
          description: 'If true, user data will be included. If false, user data will be omitted. Note: this parameter has been listed to serve as an example and may not be valid for every report.'
      index:
        method: GET
        path: /api/v1/accounts/{account_id}/reports/{report}
        description: Index of Reports
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: report
          type: string
          required: true
          positional: true
          description: report (path)
      show:
        method: GET
        path: /api/v1/accounts/{account_id}/reports/{report}/{id}
        description: Status of a Report
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: report
          type: string
          required: true
          positional: true
          description: report (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      destroy:
        method: DELETE
        path: /api/v1/accounts/{account_id}/reports/{report}/{id}
        description: Delete a Report
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: report
          type: string
          required: true
          positional: true
          description: report (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      abort:
        method: PUT
        path: /api/v1/accounts/{account_id}/reports/{report}/{id}/abort
        description: Abort a Report
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: report
          type: string
          required: true
          positional: true
          description: report (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
  accounts:
    description: API for accessing account data.
    endpoints:
      index:
        method: GET
        path: /api/v1/accounts
        description: List accounts
        params:
        - name: include[]
          type: string
          required: false
          description: 'Array of additional information to include. "lti_guid":: the ''tool_consumer_instance_guid'' that will be sent for this account on LTI launches "registration_settings":: returns info about the privacy policy and terms of use "services":: retu'
      horizon_accounts:
        method: GET
        path: /api/v1/horizon_accounts
        description: List horizon accounts
        params:
        - name: include[]
          type: string
          required: false
          description: 'Array of additional information to include. "lti_guid":: the ''tool_consumer_instance_guid'' that will be sent for this account on LTI launches "registration_settings":: returns info about the privacy policy and terms of use "services":: retu'
      manageable_accounts:
        method: GET
        path: /api/v1/manageable_accounts
        description: Get accounts that admins can manage
      course_creation_accounts:
        method: GET
        path: /api/v1/course_creation_accounts
        description: Get accounts that users can create courses in
      course_accounts:
        method: GET
        path: /api/v1/course_accounts
        description: List accounts for course admins
      show:
        method: GET
        path: /api/v1/accounts/{id}
        description: Get a single account
        params:
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      show_settings:
        method: GET
        path: /api/v1/accounts/{account_id}/settings
        description: Settings
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      environment:
        method: GET
        path: /api/v1/settings/environment
        description: List environment settings
      permissions:
        method: GET
        path: /api/v1/accounts/{account_id}/permissions
        description: Permissions
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: permissions[]
          type: string
          required: false
          description: List of permissions to check against the authenticated user. Permission names are documented in the List assignable permissions endpoint.
      sub_accounts:
        method: GET
        path: /api/v1/accounts/{account_id}/sub_accounts
        description: Get the sub-accounts of an account
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: recursive
          type: bool
          required: false
          description: If true, the entire account tree underneath this account will be returned (though still paginated). If false, only direct sub-accounts of this account will be returned. Defaults to false.
        - name: order
          type: string
          required: false
          description: 'Sorts the accounts by id or name. Only applies when recursive is false. Defaults to id. Allowed values: id, name'
        - name: include[]
          type: string
          required: false
          description: 'Array of additional information to include. "course_count":: returns the number of courses directly under each account "sub_account_count":: returns the number of sub-accounts directly under each account Allowed values: course_count, sub_ac'
      terms_of_service:
        method: GET
        path: /api/v1/accounts/{account_id}/terms_of_service
        description: Get the Terms of Service
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      help_links:
        method: GET
        path: /api/v1/accounts/{account_id}/help_links
        description: Get help links
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      manually_created_courses_account:
        method: GET
        path: /api/v1/manually_created_courses_account
        description: Get the manually-created courses sub-account for the domain root account
      courses_api:
        method: GET
        path: /api/v1/accounts/{account_id}/courses
        description: List active courses in an account
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: with_enrollments
          type: bool
          required: false
          description: If true, include only courses with at least one enrollment. If false, include only courses with no enrollments. If not present, do not filter on course enrollment status.
        - name: enrollment_type[]
          type: string
          required: false
          description: 'If set, only return courses that have at least one user enrolled in in the course with one of the specified enrollment types. Allowed values: teacher, student, ta, observer, designer'
        - name: enrollment_workflow_state[]
          type: string
          required: false
          description: 'If set, only return courses that have at least one user enrolled in in the course with one of the specified enrollment workflow states. Allowed values: active, completed, deleted, invited, pending, creation_pending, rejected, inactive'
        - name: published
          type: bool
          required: false
          description: If true, include only published courses. If false, exclude published courses. If not present, do not filter on published status.
        - name: completed
          type: bool
          required: false
          description: If true, include only completed courses (these may be in state 'completed', or their enrollment term may have ended). If false, exclude completed courses. If not present, do not filter on completed status.
        - name: blueprint
          type: bool
          required: false
          description: If true, include only blueprint courses. If false, exclude them. If not present, do not filter on this basis.
        - name: blueprint_associated
          type: bool
          required: false
          description: If true, include only courses that inherit content from a blueprint course. If false, exclude them. If not present, do not filter on this basis.
        - name: public
          type: bool
          required: false
          description: If true, include only public courses. If false, exclude them. If not present, do not filter on this basis.
        - name: by_teachers[]
          type: int
          required: false
          description: List of User IDs of teachers; if supplied, include only courses taught by one of the referenced users.
        - name: by_subaccounts[]
          type: int
          required: false
          description: List of Account IDs; if supplied, include only courses associated with one of the referenced subaccounts.
        - name: hide_enrollmentless_courses
          type: bool
          required: false
          description: If present, only return courses that have at least one enrollment. Equivalent to 'with_enrollments=true'; retained for compatibility.
        - name: state[]
          type: string
          required: false
          description: 'If set, only return courses that are in the given state(s). By default, all states but "deleted" are returned. Allowed values: created, claimed, available, completed, deleted, all'
        - name: enrollment_term_id[]
          type: int
          required: false
          description: If set, only includes courses from the specified terms. Can be either a single ID or an array of enrollment term IDs.
        - name: search_term
          type: string
          required: false
          description: The partial course name, code, or full ID to match and return in the results list. Must be at least 3 characters.
        - name: include[]
          type: string
          required: false
          description: '- All explanations can be seen in the Course API index documentation - "sections", "needs_grading_count" and "total_scores" are not valid options at the account level Allowed values: syllabus_body, term, course_progress, storage_quota_used_'
        - name: sort
          type: string
          required: false
          description: 'The column to sort results by. Allowed values: course_status, course_name, sis_course_id, teacher, account_name'
        - name: order
          type: string
          required: false
          description: 'The order to sort the given column by. Allowed values: asc, desc'
        - name: search_by
          type: string
          required: false
          description: 'The filter to search by. "course" searches for course names, course codes, and SIS IDs. "teacher" searches for teacher names Allowed values: course, teacher'
        - name: starts_before
          type: string
          required: false
          description: If set, only return courses that start before the value (inclusive) or their enrollment term starts before the value (inclusive) or both the course's start_at and the enrollment term's start_at are set to null. The value should be formatted
        - name: ends_after
          type: string
          required: false
          description: 'If set, only return courses that end after the value (inclusive) or their enrollment term ends after the value (inclusive) or both the course''s end_at and the enrollment term''s end_at are set to null. The value should be formatted as: yyyy-'
        - name: homeroom
          type: bool
          required: false
          description: If set, only return homeroom courses.
      update:
        method: PUT
        path: /api/v1/accounts/{id}
        description: Update an account
        params:
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        body:
        - name: account[name]
          type: string
          required: false
          description: Updates the account name
        - name: account[sis_account_id]
          type: string
          required: false
          description: Updates the account sis_account_id Must have manage_sis permission and must not be a root_account.
        - name: account[default_time_zone]
          type: string
          required: false
          description: The default time zone of the account. Allowed time zones are IANA time zones or friendlier Ruby on Rails time zones.
        - name: account[default_storage_quota_mb]
          type: int
          required: false
          description: The default course storage quota to be used, if not otherwise specified.
        - name: account[default_user_storage_quota_mb]
          type: int
          required: false
          description: The default user storage quota to be used, if not otherwise specified.
        - name: account[default_group_storage_quota_mb]
          type: int
          required: false
          description: The default group storage quota to be used, if not otherwise specified.
        - name: account[course_template_id]
          type: int
          required: false
          description: The ID of a course to be used as a template for all newly created courses. Empty means to inherit the setting from parent account, 0 means to not use a template even if a parent account has one set. The course must be marked as a template.
        - name: account[parent_account_id]
          type: int
          required: false
          description: The ID of a parent account to move the account to. The new parent account must be in the same root account as the original. The hierarchy of sub-accounts will be preserved in the new parent account. The caller must be an administrator in bo
        - name: account[settings][restrict_student_past_view][value]
          type: bool
          required: false
          description: Restrict students from viewing courses after end date
        - name: account[settings][restrict_student_past_view][locked]
          type: bool
          required: false
          description: Lock this setting for sub-accounts and courses
        - name: account[settings][restrict_student_future_view][value]
          type: bool
          required: false
          description: Restrict students from viewing courses before start date
        - name: account[settings][microsoft_sync_enabled]
          type: bool
          required: false
