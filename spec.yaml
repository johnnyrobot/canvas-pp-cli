          required: false
          description: 'Optionally include additional data: - "alignment_distributions": include contributing score distributions for alignments'
        - name: only_assignment_alignments
          type: bool
          required: false
          description: 'If true and alignment_distributions is included, only include assignment alignments. Default: false.'
        - name: show_unpublished_assignments
