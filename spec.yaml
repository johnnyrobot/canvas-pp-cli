  custom_gradebook_columns:
    description: API for adding additional columns to the gradebook. Custom gradebook columns will be displayed with the other frozen gradebook columns.
    endpoints:
      index:
        method: GET
        path: /api/v1/courses/{course_id}/custom_gradebook_columns
        description: List custom gradebook columns
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: include_hidden
          type: bool
          required: false
          description: Include hidden parameters (defaults to false)
      create:
        method: POST
        path: /api/v1/courses/{course_id}/custom_gradebook_columns
        description: Create a custom gradebook column
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        body:
        - name: column[title]
          type: string
          required: true
          description: no description
        - name: column[position]
          type: int
          required: false
          description: The position of the column relative to other custom columns
        - name: column[hidden]
          type: bool
          required: false
          description: Hidden columns are not displayed in the gradebook
        - name: column[teacher_notes]
          type: bool
          required: false
          description: Set this if the column is created by a teacher. The gradebook only supports one teacher_notes column.
        - name: column[read_only]
          type: bool
          required: false
          description: Set this to prevent the column from being editable in the gradebook ui
      update:
        method: PUT
        path: /api/v1/courses/{course_id}/custom_gradebook_columns/{id}
        description: Update a custom gradebook column
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      destroy:
        method: DELETE
        path: /api/v1/courses/{course_id}/custom_gradebook_columns/{id}
        description: Delete a custom gradebook column
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      reorder:
        method: POST
        path: /api/v1/courses/{course_id}/custom_gradebook_columns/reorder
        description: Reorder custom columns
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        body:
        - name: order[]
          type: int
          required: true
          description: no description
      index_2:
        method: GET
        path: /api/v1/courses/{course_id}/custom_gradebook_columns/{id}/data
        description: List entries for a column
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        - name: include_hidden
          type: bool
          required: false
          description: If true, hidden columns will be included in the result. If false or absent, only visible columns will be returned.
      update_2:
        method: PUT
        path: /api/v1/courses/{course_id}/custom_gradebook_columns/{id}/data/{user_id}
        description: Update column data
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        - name: user_id
          type: string
          required: true
          positional: true
