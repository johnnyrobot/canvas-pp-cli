        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: outcome_id
          type: string
          required: true
          positional: true
          description: outcome id (path)
        - name: user_ids[]
          type: int
          required: false
          description: If specified, only the users whose ids are given will be included in the results. It is an error to specify an id for a user who is not a student in the context.
        - name: only_assignment_alignments
          type: bool
          required: false
          description: If specified, only assignment alignments will be included in the results.
        - name: show_unpublished_assignments
          type: bool
          required: false
          description: If true, unpublished assignments will be included in the results. Defaults to false.
      mastery_distribution:
        method: GET
        path: /api/v1/courses/{course_id}/outcome_mastery_distribution
        description: Get mastery distribution
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: exclude[]
          type: string
          required: false
          description: 'Optionally restrict which results are included: - "missing_user_rollups": exclude students without any scores - "missing_outcome_results": exclude outcomes without any results'
        - name: outcome_ids[]
