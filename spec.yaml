  gradebook_history:
    description: API for accessing the versioned history of student submissions along with their grade changes, organized by the date of the submission.
    endpoints:
      days:
        method: GET
        path: /api/v1/courses/{course_id}/gradebook_history/days
        description: Days in gradebook history for this course
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
      day_details:
        method: GET
        path: /api/v1/courses/{course_id}/gradebook_history/{date}
        description: Details for a given date in gradebook history for this course
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: date
          type: string
          required: true
          positional: true
          description: date (path)
      submissions:
        method: GET
        path: /api/v1/courses/{course_id}/gradebook_history/{date}/graders/{grader_id}/assignments/{assignment_id}/submissions
        description: Lists submissions
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: date
          type: string
          required: true
          positional: true
          description: date (path)
        - name: grader_id
          type: string
          required: true
          positional: true
          description: grader id (path)
        - name: assignment_id
          type: string
          required: true
          positional: true
          description: assignment id (path)
      feed:
        method: GET
        path: /api/v1/courses/{course_id}/gradebook_history/feed
        description: List uncollated submission versions
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: assignment_id
          type: int
          required: false
          description: The ID of the assignment for which you want to see submissions. If absent, versions of submissions from any assignment in the course are included.
        - name: user_id
          type: int
          required: false
          description: The ID of the user for which you want to see submissions. If absent, versions of submissions from any user in the course are included.
        - name: ascending
          type: bool
          required: false
          description: Returns submission versions in ascending date order (oldest first). If absent, returns submission versions in descending date order (newest first).
