          type: bool
          required: false
          description: If true, results that are hidden from the learning mastery gradebook and student rollup scores will be included
      outcome_order:
        method: POST
        path: /api/v1/courses/{course_id}/assign_outcome_order
        description: Set outcome ordering for LMGB
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
      rollups:
        method: GET
        path: /api/v1/courses/{course_id}/outcome_rollups
        description: Get outcome result rollups
        params:
        - name: course_id
          type: string
          required: true
          positional: true
          description: course id (path)
        - name: aggregate
          type: string
          required: false
          description: 'If specified, instead of returning one rollup for each user, all the user rollups will be combined into one rollup for the course that will contain the average (or median, see below) rollup score for each outcome. Allowed values: course'
        - name: aggregate_stat
          type: string
          required: false
          description: 'If aggregate rollups requested, then this value determines what statistic is used for the aggregate. Defaults to "mean" if this value is not specified. Allowed values: mean, median'
        - name: user_ids[]
          type: int
          required: false
          description: If specified, only the users whose ids are given will be included in the results or used in an aggregate result. it is an error to specify an id for a user who is not a student in the context
        - name: outcome_ids[]
          type: int
          required: false
          description: If specified, only the outcomes whose ids are given will be included in the results. it is an error to specify an id for an outcome which is not linked to the context.
        - name: include[]
          type: string
          required: false
          description: '[String, "courses"'
        - name: exclude[]
          type: string
          required: false
          description: 'Specify additional values to exclude. "missing_user_rollups" excludes rollups for users without results. "missing_outcome_results" excludes outcomes without results. Allowed values: missing_user_rollups, missing_outcome_results, \\'
        - name: sort_by
          type: string
          required: false
          description: 'If specified, sorts outcome result rollups. "student" sorting will sort by a user''s sortable name. "outcome" sorting will sort by the given outcome''s rollup score. The latter requires specifying the "sort_outcome_id" parameter. By default, '
        - name: sort_outcome_id
          type: int
          required: false
          description: If outcome sorting requested, then this determines which outcome to use for rollup score sorting.
        - name: sort_order
          type: string
          required: false
          description: 'If sorting requested, then this allows changing the default sort order of ascending to descending. Allowed values: asc, desc'
        - name: add_defaults
          type: bool
          required: false
          description: If defaults are requested, then color and mastery level defaults will be added to outcome ratings in the rollup. This will only take effect if the Account Level Mastery Scales FF is DISABLED
        - name: contributing_scores
          type: bool
          required: false
          description: 'DEPRECATED: This parameter is deprecated. Use the separate GET /api/v1/courses/:course_id/outcomes/:outcome_id/contributing_scores endpoint instead to fetch contributing scores for a specific outcome. If contributing scores are requested, t'
      contributing_scores:
        method: GET
        path: /api/v1/courses/{course_id}/outcomes/{outcome_id}/contributing_scores
        description: Get contributing scores
