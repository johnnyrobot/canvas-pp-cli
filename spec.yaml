  sis_imports:
    description: API for importing data from Student Information Systems
    endpoints:
      index:
        method: GET
        path: /api/v1/accounts/{account_id}/sis_imports
        description: Get SIS import list
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: created_since
          type: string
          required: false
          description: If set, only shows imports created after the specified date (use ISO8601 format)
        - name: created_before
          type: string
          required: false
          description: If set, only shows imports created before the specified date (use ISO8601 format)
        - name: workflow_state[]
          type: string
          required: false
          description: 'If set, only returns imports that are in the given state. Allowed values: initializing, created, importing, cleanup_batch, imported, imported_with_messages, aborted, failed, failed_with_messages, restoring, partially_restored, restored'
      importing:
        method: GET
        path: /api/v1/accounts/{account_id}/sis_imports/importing
        description: Get the current importing SIS import
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
      create:
        method: POST
        path: /api/v1/accounts/{account_id}/sis_imports
        description: Import SIS data
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        body:
        - name: import_type
          type: string
          required: false
          description: Choose the data format for reading SIS data. With a standard Canvas install, this option can only be 'instructure_csv', and if unprovided, will be assumed to be so. Can be part of the query string.
        - name: attachment
          type: string
          required: false
          description: 'There are three ways to post SIS import data: 1. As a multipart/form-data form field named +attachment+ 2. As a raw post with a Content-Type of application/zip or application/octet-stream 3. Using the File Upload process, which can be more '
        - name: pre_attachment[name]
          type: string
          required: false
          description: The name of the file to be uploaded (in a separate request) via the File Upload workflow. This is the recommended way to upload larger batches, since the upload itself no longer has to finish within the 1-minute Canvas request timeout perio
        - name: pre_attachment[*]
          type: string
          required: false
          description: Other file upload properties; see [File Upload Documentation](/services/canvas/basics/file.file_uploads)
        - name: extension
          type: string
          required: false
          description: Recommended for raw post request style imports. This field will be used to distinguish between zip, xml, csv, and other file format extensions that would usually be provided with the filename in the multipart post request scenario. If not p
        - name: batch_mode
          type: bool
          required: false
          description: If set, this SIS import will be run in batch mode, deleting any data previously imported via SIS that is not present in this latest import. See the SIS CSV Format page for details. Batch mode cannot be used with diffing.
        - name: batch_mode_term_id
          type: string
          required: false
          description: Limit deletions to only this term. Required if batch mode is enabled.
        - name: multi_term_batch_mode
          type: bool
          required: false
          description: Runs batch mode against all terms in terms file. Requires change_threshold.
        - name: skip_deletes
          type: bool
          required: false
          description: When set the import will skip any deletes. This does not account for objects that are deleted during the batch mode cleanup process.
        - name: override_sis_stickiness
          type: bool
          required: false
          description: Default is false. If true, any fields containing “sticky” or UI changes will be overridden. See SIS CSV Format documentation for information on which fields can have SIS stickiness
        - name: add_sis_stickiness
          type: bool
          required: false
          description: This option, if present, will process all changes as if they were UI changes. This means that "stickiness" will be added to changed fields. This option is only processed if 'override_sis_stickiness' is also provided.
        - name: clear_sis_stickiness
          type: bool
          required: false
          description: This option, if present, will clear "stickiness" from all fields processed by this import. Requires that 'override_sis_stickiness' is also provided. If 'add_sis_stickiness' is also provided, 'clear_sis_stickiness' will overrule the behavior
        - name: update_sis_id_if_login_claimed
          type: bool
          required: false
          description: This option, if present, will override the old (or non-existent) non-matching SIS ID with the new SIS ID in the upload, if a pseudonym is found from the login field and the SIS ID doesn't match.
        - name: diffing_data_set_identifier
          type: string
          required: false
          description: If set on a CSV import, Canvas will attempt to optimize the SIS import by comparing this set of CSVs to the previous set that has the same data set identifier, and only applying the difference between the two. See the SIS CSV Format documen
        - name: diffing_remaster_data_set
          type: bool
          required: false
          description: If true, and diffing_data_set_identifier is sent, this SIS import will be part of the data set, but diffing will not be performed. See the SIS CSV Format documentation for details.
        - name: diffing_drop_status
          type: string
          required: false
          description: 'If diffing_drop_status is passed, this SIS import will use this status for enrollments that are not included in the sis_batch. Defaults to ''deleted'' Allowed values: deleted, completed, inactive'
        - name: diffing_user_remove_status
          type: string
          required: false
          description: 'For users removed from one batch to the next one using the same diffing_data_set_identifier, set their status to the value of this argument. Defaults to ''deleted''. Allowed values: deleted, suspended'
        - name: batch_mode_enrollment_drop_status
          type: string
          required: false
          description: If batch_mode_enrollment_drop_status is passed, this SIS import will use this status for enrollments that are not included in the sis_batch. This will have an effect if multi_term_batch_mode is set. Defaults to 'deleted' This will still mar
        - name: change_threshold
          type: int
          required: false
          description: If set with batch_mode, the batch cleanup process will not run if the number of items deleted is higher than the percentage set. If set to 10 and a term has 200 enrollments, and batch would delete more than 20 of the enrollments the batch w
        - name: diff_row_count_threshold
          type: int
          required: false
          description: If set with diffing, diffing will not be performed if the number of rows to be run in the fully calculated diff import exceeds the threshold.
      show:
        method: GET
        path: /api/v1/accounts/{account_id}/sis_imports/{id}
        description: Get SIS import status
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      restore_states:
        method: PUT
        path: /api/v1/accounts/{account_id}/sis_imports/{id}/restore_states
        description: Restore workflow_states of SIS imported items
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
        body:
        - name: batch_mode
          type: bool
          required: false
          description: If set, will only restore items that were deleted from batch_mode.
        - name: undelete_only
          type: bool
          required: false
          description: If set, will only restore items that were deleted. This will ignore any items that were created or modified.
        - name: unconclude_only
          type: bool
          required: false
          description: If set, will only restore enrollments that were concluded. This will ignore any items that were created or deleted.
      abort:
        method: PUT
        path: /api/v1/accounts/{account_id}/sis_imports/{id}/abort
        description: Abort SIS import
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
        - name: id
          type: string
          required: true
          positional: true
          description: id (path)
      abort_all_pending:
        method: PUT
        path: /api/v1/accounts/{account_id}/sis_imports/abort_all_pending
        description: Abort all pending SIS imports
        params:
        - name: account_id
          type: string
          required: true
          positional: true
          description: account id (path)
