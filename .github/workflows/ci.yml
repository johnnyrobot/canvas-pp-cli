name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must stay >= 1.27.3. These are all fixed in the toolchain rather
          # than in our code, so the pin is the only lever:
          #   GO-2026-5856  Encrypted Client Hello privacy leak (crypto/tls)
          #   GO-2026-6218  net/url
          #   GO-2026-6090  crypto/tls
          #   GO-2026-6089  ReadHeaderTimeout on the h2c check (net/http)
          #   GO-2026-5972  recursion depth in encoding/asn1
          #   GO-2026-5026  ASCII-only Punycode labels (x/net/idna via net/http)
          # Fixed in 1.27.2:
          #   GO-2026-6603  HTTP/2 server memory exhaustion from Trailer headers (net/http)
          #   GO-2026-6605  HTTP/1 client desync after a rejected CONNECT (net/http)
          #   GO-2026-6607  malformed ECH outer extension references (crypto/tls)
          #   GO-2026-6608  memory limit bypass parsing MIME headers (mime/multipart)
          #   GO-2026-6610  HTTP/2 transport accepts malformed framing headers (net/http)
          #   GO-2026-6611  CPU burned by repeated initial window changes (net/http)
          #   GO-2026-6612  double flow-control refund on HTTP/2 streams (net/http)
          #   GO-2026-6613  HTTP/1 server desync after a 2xx CONNECT response (net/http)
          #   GO-2026-6617  HTTP/2 server crash from an HPACK encoder race (net/http)
          # Fixed in 1.27.3 — this one is why the pin is .3 and not .2:
          #   GO-2026-6809  distrust compromised intermediate certificates (crypto/x509)
          go-version: '1.27.3'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
