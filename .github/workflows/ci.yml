name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must stay >= 1.26.6. These are all fixed in the toolchain rather
          # than in our code, so the pin is the only lever:
          #   GO-2026-5856  Encrypted Client Hello privacy leak (crypto/tls)
          #   GO-2026-6218  net/url
          #   GO-2026-6090  crypto/tls
          #   GO-2026-6089  ReadHeaderTimeout on the h2c check (net/http)
          #   GO-2026-5972  recursion depth in encoding/asn1
          #   GO-2026-5026  ASCII-only Punycode labels (x/net/idna via net/http)
          go-version: '1.26.6'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
