version: 2
project_name: canvas-pp-cli
changelog:
  disable: true
builds:
  - id: canvas-pp-cli
    main: ./cmd/canvas-pp-cli
    binary: canvas-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/johnnyrobot/canvas-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: canvas-pp-mcp
    main: ./cmd/canvas-pp-mcp
    binary: canvas-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: canvas-pp-cli
    repository:
      owner: johnnyrobot
      name: homebrew-tap
      # The built-in Actions GITHUB_TOKEN is scoped to this repo only and cannot
      # push to the tap. Needs a PAT with `repo` scope, stored as the
      # HOMEBREW_TAP_GITHUB_TOKEN secret. Without it the release fails at the
      # formula push, after the binaries have already uploaded.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/johnnyrobot/canvas-pp-cli"
    description: "The whole Canvas REST API in one Go binary — plus a local store, offline search, and cross-resource commands (roster, at-risk, standings) that no single Canvas endpoint returns."
    install: |
      bin.install "canvas-pp-cli"
      bin.install "canvas-pp-mcp"
